name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
          - 24

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: git diff --exit-code -- dist
      - run: bun run typecheck
      - run: bun pm pack --dry-run

  bun-install:
    name: Bun ${{ matrix.bun }} global install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - 1.4.0
          - latest
          - canary

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - shell: bash
        run: |
          bun install --global "github:$GITHUB_REPOSITORY#$GITHUB_SHA"
          expected=$(node --print "require('./package.json').version")
          test "$(vcx --version)" = "$expected"

  install-script:
    name: install.sh on ${{ matrix.os }} (${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun: preinstalled
          - os: macos-latest
            bun: installed by script

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: matrix.bun == 'preinstalled'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
      - shell: bash
        env:
          VCX_REF: ${{ github.sha }}
        run: |
          sh install.sh
          export PATH="$HOME/.bun/bin:$PATH"
          expected=$(node --print "require('./package.json').version")
          test "$(vcx --version)" = "$expected"
          vercel --version
